server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: неизвестные пути (например, если позже появится роутинг)
    # тоже отдают index.html, а не 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика с хэшем в имени — можно кэшировать надолго.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
